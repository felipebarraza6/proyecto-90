# Deploy Front desactivado en push.
# Felipe publica a 90dias.habitofirme.app por build + FTP manual; este Action
# fallaba en cada push (el fork no tiene secretos FTP / no es el sitio de prod).
# Se deja solo workflow_dispatch por si hace falta dispararlo a mano alguna vez.

name: Deploy Front (90dias)

on:
  workflow_dispatch:

concurrency:
  group: deploy-front
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        run: npm run build
        env:
          VITE_API_BASE: https://api.yggdra.cl

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Subir assets (sin index.html)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: lftp -e "set ssl:verify-certificate no; set net:max-retries 3; mirror -R --only-newer --exclude-glob index.html dist/client /90dias.habitofirme.app; bye" -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"

      - name: Subir index.html al final
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: lftp -e "set ssl:verify-certificate no; put -O /90dias.habitofirme.app dist/client/index.html; bye" -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"

      - name: Verificar despliegue
        run: |
          sleep 5
          code=$(curl -s -o /tmp/live.html -w "%{http_code}" https://90dias.habitofirme.app/)
          echo "HTTP $code"
          grep -o "assets/index[^\"]*" /tmp/live.html | head -2
          test "$code" = "200"
